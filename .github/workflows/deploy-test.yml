name: Deploy to Kinsta Test Environment

# Development-only deployment pipeline.
# Fires strictly on pushes to `test` — never touches `main` or production.
on:
  push:
    branches:
      - test

# Prevent overlapping deploys if multiple commits land in quick succession.
concurrency:
  group: deploy-test
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy test branch to Kinsta
    runs-on: ubuntu-latest
    steps:
      - name: Checkout test branch
        uses: actions/checkout@v7

      - name: Resolve deployed commit
        id: commit
        run: echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.KINSTA_TEST_HOST }}
          username: ${{ secrets.KINSTA_TEST_USERNAME }}
          port: ${{ secrets.KINSTA_TEST_PORT }}
          key: ${{ secrets.KINSTA_TEST_SSH_KEY }}
          script_stop: true
          command_timeout: 5m
          script: |
            set -euo pipefail
            PLUGIN_DIR=~/public/wp-content/plugins/lumn-utilities
            mkdir -p ~/.ssh
            chmod 700 ~/.ssh
            cat > ~/.ssh/lumn_utilities_deploy_key <<'DEPLOY_KEY'
            ${{ secrets.KINSTA_TEST_GIT_DEPLOY_KEY }}
            DEPLOY_KEY
            chmod 600 ~/.ssh/lumn_utilities_deploy_key
            if ! grep -q "^Host github-lumn-utilities$" ~/.ssh/config 2>/dev/null; then
            printf '%s\n' "Host github-lumn-utilities" "  HostName github.com" "  User git" "  IdentityFile ~/.ssh/lumn_utilities_deploy_key" "  IdentitiesOnly yes" "  StrictHostKeyChecking accept-new" >> ~/.ssh/config
            fi
            chmod 600 ~/.ssh/config
            if [ -d "$PLUGIN_DIR/.git" ]; then
            echo "Existing git checkout found, updating..."
            cd "$PLUGIN_DIR"
            git fetch origin test
            git reset --hard origin/test
            git clean -fd
            else
            echo "No git checkout found, performing first-time clone..."
            mkdir -p ~/public/wp-content/plugins
            if [ -d "$PLUGIN_DIR" ]; then
            mv "$PLUGIN_DIR" "$PLUGIN_DIR.bak.$(date +%Y%m%d%H%M%S)"
            fi
            git clone git@github-lumn-utilities:getlumn/lumn-utilities.git "$PLUGIN_DIR"
            cd "$PLUGIN_DIR"
            git checkout test
            fi
            echo "Deployed commit:"
            git log -1 --oneline

      - name: Report deployment
        if: success()
        run: echo "Deployed commit ${{ steps.commit.outputs.sha }} to the Kinsta test environment."
